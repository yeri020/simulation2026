<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080908" />
    <meta name="description" content="질문 하나가 교과 개념을 탐험의 세계로 바꿉니다." />
    <title>개념 탐험실 — 질문이 탐험이 되는 순간</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet" />
    <style>
      :root { color-scheme: dark; font-family: "Noto Sans KR", sans-serif; background: #080908; color: #f0f0e9; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #080908; }
      body { display: grid; place-items: center; }
      #player { position: relative; width: min(100vw, 177.7778vh); height: min(100vh, 56.25vw); margin: auto; overflow: hidden; background: #080908; }
      #film { display: block; width: 100%; height: 100%; object-fit: contain; }
      .player-controls { position: absolute; inset: auto 0 0; display: flex; justify-content: space-between; align-items: center; padding: 22px 4%; background: rgba(8,9,8,.88); }
      .controls-left { display: flex; align-items: center; gap: 12px; }
      .control-button, .start-link { min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border: 1px solid rgba(240,240,233,.34); border-radius: 2px; color: #f0f0e9; background: #080908; font: 600 12px/1 "Noto Sans KR", sans-serif; text-decoration: none; cursor: pointer; }
      .start-link { border-color: #d7ff32; background: #d7ff32; color: #080908; }
      .control-button:hover, .start-link:hover { border-color: #d7ff32; }
      .film-caption { color: #f0f0e9; font-size: 10px; letter-spacing: 1.3px; }
      #render-stage { display: none; width: 1920px; height: 1080px; }
      #render-canvas { display: block; width: 1920px; height: 1080px; }
      body.render-mode { width: 1920px; height: 1080px; }
      body.render-mode #player { display: none; }
      body.render-mode #render-stage { display: block; }
      @media (max-width: 640px) {
        .player-controls { padding: 12px 4%; }
        .film-caption { display: none; }
        .control-button, .start-link { min-height: 36px; font-size: 10px; }
      }
    </style>
  </head>
  <body>
    <main id="player" aria-label="개념 탐험실 인트로 영상">
      <video id="film" src="./assets/concept-quest-intro.mp4" autoplay muted loop playsinline aria-label="개념 탐험실 모션 인트로"></video>
      <div class="player-controls">
        <div class="controls-left">
          <a class="start-link" href="./index.html">탐험 시작 <span aria-hidden="true">↗</span></a>
          <button class="control-button" id="sound-toggle" type="button" aria-pressed="false">소리 켜기</button>
        </div>
        <span class="film-caption">CONCEPT QUEST · 15 SEC · 120 BPM</span>
      </div>
    </main>
    <main id="render-stage" aria-hidden="true"><canvas id="render-canvas" width="1920" height="1080"></canvas></main>
    <script>
      (() => {
        const WIDTH = 1920;
        const HEIGHT = 1080;
        const DURATION = 15;
        const COLORS = { black: "#080908", white: "#f0f0e9", lime: "#d7ff32", green: "#2b704e" };
        const canvas = document.querySelector("#render-canvas");
        const ctx = canvas.getContext("2d", { alpha: false });
        const clamp = (n, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, n));
        const mix = (a, b, t) => a + (b - a) * t;
        const expEase = (t) => t >= 1 ? 1 : 1 - Math.pow(2, -10 * clamp(t));
        const spring = (t) => {
          const x = clamp(t);
          return 1 - (1 + 8 * x) * Math.exp(-8 * x);
        };
        const pulseAt = (t) => Math.exp(-13 * ((t * 2) % 1));

        function text(value, x, y, size, color = COLORS.white, align = "left", weight = 900) {
          ctx.save();
          ctx.textAlign = align;
          ctx.textBaseline = "middle";
          ctx.font = `${weight} ${size}px "Noto Sans KR", sans-serif`;
          ctx.fillStyle = color;
          ctx.fillText(value, x, y);
          ctx.restore();
        }

        function line(x1, y1, x2, y2, color = COLORS.green, width = 2) {
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.strokeStyle = color;
          ctx.lineWidth = width;
          ctx.stroke();
        }

        function directionalText(value, x, y, size, color, vx, vy) {
          const speed = Math.hypot(vx, vy);
          const smear = clamp(speed / 2600, 0, 1) * 34;
          if (smear > 1) {
            for (let i = 3; i > 0; i--) {
              ctx.save();
              ctx.globalAlpha = 0.075 * (4 - i);
              text(value, x - vx / speed * smear * i / 3, y - vy / speed * smear * i / 3, size, color);
              ctx.restore();
            }
          }
          text(value, x, y, size, color);
        }

        function drawChrome(t) {
          ctx.fillStyle = COLORS.black;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
          ctx.fillStyle = COLORS.lime;
          ctx.fillRect(74, 49, 9, 9);
          text("CONCEPT QUEST  /  MOTION STUDY", 97, 54, 15, COLORS.white, "left", 600);
          text("15 SEC     ·     120 BPM", 1844, 54, 14, COLORS.white, "right", 600);
          line(72, 86, 1848, 86, COLORS.green, 1);
          line(72, 1000, 1848, 1000, COLORS.green, 1);
          text("질문 → 개념 → 탐험", 74, 1030, 13, COLORS.white, "left", 600);
          text("01 — 07", 1847, 1030, 13, COLORS.white, "right", 600);
          const beat = Math.floor(t * 2);
          const wrap = t >= 14.5 ? spring((t - 14.5) / 0.5) : 0;
          const progress = mix(Math.min(beat, 29), 0, wrap);
          const active = Math.floor(progress);
          const pulse = mix(pulseAt(t), 1, wrap);
          for (let i = 0; i < 30; i++) {
            const x = 672 + i * 18;
            const h = i === active ? 20 + pulse * 16 : i < progress ? 8 : 4;
            ctx.fillStyle = i === active ? COLORS.lime : i < progress ? COLORS.green : COLORS.white;
            ctx.fillRect(x, 1047 - h, 3, h);
          }
        }

        function drawHook(t) {
          const prompts = ["왜", "무엇이", "어떻게", "왜 그럴까"];
          const beat = Math.floor(t * 2) % prompts.length;
          const prompt = prompts[beat];
          const size = prompt.length > 3 ? 204 : prompt.length > 2 ? 262 : 340;
          text("처음은 작은 물음에서", 238, 355, 22, COLORS.white, "left", 600);
          ctx.save();
          ctx.font = `900 ${size}px "Noto Sans KR", sans-serif`;
          const wordWidth = ctx.measureText(prompt).width;
          const startX = (WIDTH - wordWidth - size * 0.42) / 2;
          ctx.restore();
          const phase = (t * 2) % 1;
          const direction = beat % 2 ? 1 : -1;
          const motion = Math.sin(phase * Math.PI) * direction * 34;
          const velocity = Math.cos(phase * Math.PI) * direction * 220;
          directionalText(prompt, startX + motion, 566, size, COLORS.white, velocity, 0);
          directionalText("?", startX + wordWidth + motion, 566, size, COLORS.lime, velocity, 0);
          const width = 260 + beat * 98 + pulseAt(t) * 36;
          line(744, 758, 744 + width, 758, COLORS.lime, 5);
          text("하나의 질문이 배움을 움직인다", 742, 814, 20, COLORS.white, "left", 600);
        }

        function drawKineticType(t) {
          const local = t - 2;
          const beatStep = Math.min(3, Math.floor(local * 2));
          const words = ["질문이", "생각을", "개념을", "세상으로"];
          const phase = (local * 2) % 1;
          const x = 236 + beatStep * 102 + (1 - expEase(phase / 0.16)) * 190;
          const vx = phase < 0.16 ? -2700 * (1 - phase / 0.16) : 0;
          text("질문 → 생각 → 개념 → 탐험", 242, 345, 22, COLORS.white, "left", 600);
          directionalText(words[beatStep], x, 492, 168, COLORS.white, vx, 0);
          text("움직인다", 242 + beatStep * 42, 684, 168, COLORS.lime);
          line(245, 797, 620 + beatStep * 270 + phase * 80, 797, COLORS.green, 3);
          text("ASK  /  CONNECT  /  DISCOVER", 246, 840, 14, COLORS.white, "left", 600);
        }

        function drawMorphShape(t) {
          const local = t - 4;
          const phase = local * Math.PI * 2;
          const shapeMix = clamp(local / 2);
          const cx = 1316;
          const cy = 553;
          const base = 205 + Math.sin(phase * 2) * 13;
          ctx.beginPath();
          for (let i = 0; i <= 96; i++) {
            const a = i / 96 * Math.PI * 2;
            const circleR = base * (1 + 0.06 * Math.sin(3 * a + phase));
            const leafR = base * (1 + 0.29 * Math.cos(a) + 0.11 * Math.sin(2 * a + phase));
            const r = mix(circleR, leafR, shapeMix);
            const px = cx + Math.cos(a) * r * 0.82;
            const py = cy + Math.sin(a) * r * 1.05;
            if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
          }
          ctx.closePath();
          ctx.fillStyle = COLORS.green;
          ctx.fill();
          ctx.strokeStyle = COLORS.lime;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(cx - 118, cy + 48);
          ctx.quadraticCurveTo(cx + 18, cy + 10 + Math.sin(phase) * 18, cx + 122, cy - 116);
          ctx.strokeStyle = COLORS.white;
          ctx.lineWidth = 2;
          ctx.stroke();
          text("개념은 형태를 바꾸며 이어진다", 248, 456, 58, COLORS.white);
          text("물방울 하나가 관계의 지도가 된다", 252, 535, 22, COLORS.lime, "left", 600);
          text("SHAPE  /  MEANING  /  MOTION", 252, 610, 14, COLORS.white, "left", 600);
        }

        function project3d(point, angle, tilt, cx, cy, scale) {
          const [x, y, z] = point;
          const rx = x * Math.cos(angle) - z * Math.sin(angle);
          const rz = x * Math.sin(angle) + z * Math.cos(angle);
          const ry = y * Math.cos(tilt) - rz * Math.sin(tilt);
          const depth = y * Math.sin(tilt) + rz * Math.cos(tilt);
          const perspective = 4.3 / (4.3 + depth);
          return [cx + rx * scale * perspective, cy + ry * scale * perspective, depth];
        }

        function drawSolid(t) {
          const local = t - 6;
          const angle = local * Math.PI * 0.72;
          const tilt = 0.45 + Math.sin(local * Math.PI) * 0.13;
          const cx = 1255;
          const cy = 548;
          const size = 195;
          const points = [];
          for (let i = 0; i < 8; i++) {
            points.push(project3d([(i & 1) ? 1 : -1, (i & 2) ? 1 : -1, (i & 4) ? 1 : -1], angle, tilt, cx, cy, size));
          }
          const faces = [[0, 1, 3, 2], [4, 5, 7, 6], [0, 1, 5, 4], [2, 3, 7, 6], [0, 2, 6, 4], [1, 3, 7, 5]];
          for (const face of faces) {
            const depth = face.reduce((sum, i) => sum + points[i][2], 0) / face.length;
            ctx.beginPath();
            face.forEach((i, j) => {
              if (!j) ctx.moveTo(points[i][0], points[i][1]); else ctx.lineTo(points[i][0], points[i][1]);
            });
            ctx.closePath();
            ctx.fillStyle = depth > 0 ? COLORS.green : COLORS.black;
            ctx.fill();
            ctx.strokeStyle = depth > 0 ? COLORS.lime : COLORS.white;
            ctx.lineWidth = 2;
            ctx.stroke();
          }
          ctx.beginPath();
          for (let i = 0; i <= 80; i++) {
            const a = i / 80 * Math.PI * 2;
            const p = project3d([Math.cos(a), Math.sin(a) * 0.63, 0], -angle * 0.6, tilt, cx, cy, size * 1.16);
            if (!i) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
          }
          ctx.strokeStyle = COLORS.white;
          ctx.lineWidth = 2;
          ctx.stroke();
          text("평면의 관계가", 242, 424, 72, COLORS.white);
          text("입체적인 이해로", 242, 518, 72, COLORS.lime);
          text("전환되는 순간", 242, 610, 72, COLORS.white);
          text("2D  →  3D", 247, 736, 18, COLORS.white, "left", 600);
        }

        function drawJourney(t) {
          const labels = ["관계", "집중", "조사", "정리", "일반화", "전이", "성찰"];
          const local = t - 8;
          const active = Math.min(7, 1 + Math.floor(local * 3.5));
          const left = 188;
          const right = 1732;
          const y = 590;
          const gap = (right - left) / 6;
          text("일곱 단계, 하나의 깊은 이해", 188, 319, 57, COLORS.white);
          text("내가 질문하고, 연결하고, 새로운 상황으로 옮긴다", 191, 379, 20, COLORS.lime, "left", 600);
          line(left, y, right, y, COLORS.green, 4);
          line(left, y, left + gap * (active - 1), y, COLORS.lime, 5);
          for (let i = 0; i < 7; i++) {
            const x = left + gap * i;
            const on = i < active;
            const radius = i === active - 1 ? 22 + pulseAt(t) * 8 : 17;
            ctx.fillStyle = on ? COLORS.lime : COLORS.black;
            ctx.strokeStyle = on ? COLORS.lime : COLORS.white;
            ctx.lineWidth = 3;
            ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
            ctx.strokeRect(x - radius, y - radius, radius * 2, radius * 2);
            text(String(i + 1).padStart(2, "0"), x, y + 1, 13, on ? COLORS.black : COLORS.white, "center", 900);
            text(labels[i], x, y + 71, 20, on ? COLORS.lime : COLORS.white, "center", 600);
          }
          text(`STEP 0${active}  /  07`, 1728, 747, 14, COLORS.white, "right", 600);
        }

        function drawConceptMap(t) {
          const local = t - 10;
          const cx = 967;
          const cy = 578;
          const nodes = [
            [cx, cy - 245, "관찰"], [cx + 218, cy - 138, "질문"],
            [cx + 218, cy + 138, "사실"], [cx, cy + 245, "개념"],
            [cx - 218, cy + 138, "원리"], [cx - 218, cy - 138, "전이"],
          ];
          const reveal = clamp(local / 1.35);
          text("점과 점 사이, 배움이 연결된다", 191, 319, 55, COLORS.white);
          text("사실  →  개념  →  일반화  →  전이", 195, 383, 20, COLORS.lime, "left", 600);
          for (let i = 0; i < nodes.length; i++) {
            if (i / (nodes.length - 1) > reveal) continue;
            const next = nodes[(i + 1) % nodes.length];
            line(nodes[i][0], nodes[i][1], next[0], next[1], COLORS.green, 3);
            line(nodes[i][0], nodes[i][1], cx, cy, COLORS.green, 2);
          }
          for (let i = 0; i < nodes.length; i++) {
            const [x, y, label] = nodes[i];
            ctx.fillStyle = i === 3 ? COLORS.lime : COLORS.black;
            ctx.strokeStyle = i === 3 ? COLORS.lime : COLORS.white;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, i === 3 ? 54 : 39, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            text(label, x, y, i === 3 ? 19 : 16, i === 3 ? COLORS.black : COLORS.white, "center", 700);
          }
          const orbit = 307 + pulseAt(t) * 9;
          ctx.beginPath();
          ctx.ellipse(cx, cy, orbit, orbit * 0.44, -0.22, 0, Math.PI * 2);
          ctx.strokeStyle = COLORS.lime;
          ctx.lineWidth = 2;
          ctx.stroke();
        }

        function drawClimax(t) {
          const local = t - 12;
          const angle = local * 1.12;
          const cx = 1110;
          const cy = 564;
          const orbit = 258 + Math.sin(local * Math.PI * 2) * 20;
          const labels = ["관계", "집중", "조사", "정리", "일반화", "전이", "성찰"];
          const points = [];
          for (let i = 0; i < 7; i++) {
            const a = angle + i * Math.PI * 2 / 7;
            const p = project3d([Math.cos(a), Math.sin(a) * 0.66, Math.sin(a) * 0.5], angle * 0.3, 0.58, cx, cy, orbit);
            points.push(p);
          }
          for (let i = 0; i < 7; i++) {
            const a = points[i];
            const b = points[(i + 1) % 7];
            line(a[0], a[1], b[0], b[1], COLORS.green, 3);
            line(a[0], a[1], cx, cy, COLORS.white, 1);
          }
          for (let i = 0; i < points.length; i++) {
            const [x, y, depth] = points[i];
            const radius = 13 + (depth > 0 ? 5 : 0);
            ctx.fillStyle = i === Math.floor(local * 4) % 7 ? COLORS.lime : COLORS.black;
            ctx.strokeStyle = i === Math.floor(local * 4) % 7 ? COLORS.lime : COLORS.white;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            text(labels[i], x, y - 33, 17, COLORS.white, "center", 600);
          }
          ctx.beginPath();
          ctx.arc(cx, cy, 88 + pulseAt(t) * 14, 0, Math.PI * 2);
          ctx.fillStyle = COLORS.lime;
          ctx.fill();
          text("개념", cx, cy, 31, COLORS.black, "center", 900);
          text("배운 것을 세상으로", 182, 472, 76, COLORS.white);
          text("질문이 탐험이 되는 순간", 187, 574, 36, COLORS.lime);
          text("THINK  /  CONNECT  /  TRANSFER", 192, 649, 15, COLORS.white, "left", 600);
        }

        function drawEndTitle(t) {
          text("개념 탐험실", WIDTH / 2, 490, 116, COLORS.white, "center", 900);
          text("질문이 탐험이 되는 순간", WIDTH / 2, 583, 34, COLORS.lime, "center", 600);
          text("CONCEPT QUEST", WIDTH / 2, 688, 18, COLORS.white, "center", 600);
          const x = 732 + ((t - 14) / 0.5) * 450;
          line(x, 778, x + 456, 778, COLORS.lime, 4);
          ctx.fillStyle = COLORS.lime;
          ctx.fillRect(1194, 769, 18, 18);
        }

        function drawScene(index, t) {
          if (index === 0) drawHook(t);
          else if (index === 1) drawKineticType(t);
          else if (index === 2) drawMorphShape(t);
          else if (index === 3) drawSolid(t);
          else if (index === 4) drawJourney(t);
          else if (index === 5) drawConceptMap(t);
          else if (index === 6) drawClimax(t);
          else drawEndTitle(t);
        }

        function transformedScene(index, t, scale, dx, dy) {
          ctx.save();
          ctx.translate(WIDTH / 2 + dx, HEIGHT / 2 + dy);
          ctx.scale(scale, scale);
          ctx.translate(-WIDTH / 2, -HEIGHT / 2);
          drawScene(index, t);
          ctx.restore();
        }

        window.seek = (time) => {
          const t = ((time % DURATION) + DURATION) % DURATION;
          drawChrome(t);
          if (t < 14) {
            const bar = Math.floor(t / 2);
            const local = (t - bar * 2) / 2;
            if (bar > 0 && local < 0.14) {
              const p = spring(local / 0.14);
              transformedScene(bar - 1, t, 1 - 0.6 * p, -1200 * p, 0);
              transformedScene(bar, t, 0.4 + 0.6 * p, 900 * (1 - p), 0);
            } else {
              drawScene(bar, t);
            }
          } else if (t < 14.24) {
            const p = spring((t - 14) / 0.24);
            transformedScene(6, t, 1 - 0.6 * p, -1200 * p, 0);
            transformedScene(7, t, 0.4 + 0.6 * p, 900 * (1 - p), 0);
          } else if (t < 14.5) {
            drawScene(7, t);
          } else {
            const p = spring((t - 14.5) / 0.5);
            transformedScene(7, t, 1 - 0.6 * p, -1200 * p, 0);
            transformedScene(0, 0, 0.4 + 0.6 * p, 900 * (1 - p), 0);
          }
          return t;
        };

        function makeWav(buffer) {
          const channels = buffer.numberOfChannels;
          const sampleRate = buffer.sampleRate;
          const frames = buffer.length;
          const bytesPerSample = 2;
          const dataSize = frames * channels * bytesPerSample;
          const array = new ArrayBuffer(44 + dataSize);
          const view = new DataView(array);
          const write = (offset, value) => {
            for (let i = 0; i < value.length; i++) view.setUint8(offset + i, value.charCodeAt(i));
          };
          write(0, "RIFF"); view.setUint32(4, 36 + dataSize, true); write(8, "WAVE");
          write(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
          view.setUint16(22, channels, true); view.setUint32(24, sampleRate, true);
          view.setUint32(28, sampleRate * channels * bytesPerSample, true);
          view.setUint16(32, channels * bytesPerSample, true); view.setUint16(34, 16, true);
          write(36, "data"); view.setUint32(40, dataSize, true);
          const channelData = Array.from({ length: channels }, (_, i) => buffer.getChannelData(i));
          let offset = 44;
          for (let i = 0; i < frames; i++) {
            for (let ch = 0; ch < channels; ch++) {
              const sample = clamp(channelData[ch][i], -1, 1);
              view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
              offset += bytesPerSample;
            }
          }
          return array;
        }

        window.renderWavBase64 = async () => {
          const AudioContextClass = window.OfflineAudioContext || window.webkitOfflineAudioContext;
          if (!AudioContextClass) throw new Error("OfflineAudioContext is not available in this browser.");
          const sampleRate = 44100;
          const offline = new AudioContextClass(2, sampleRate * DURATION, sampleRate);
          const master = offline.createGain();
          master.gain.value = 0.78;
          master.connect(offline.destination);

          for (let beat = 0; beat < 30; beat++) {
            const at = beat * 0.5;
            const osc = offline.createOscillator();
            const gain = offline.createGain();
            osc.type = "sine";
            osc.frequency.setValueAtTime(118, at);
            osc.frequency.exponentialRampToValueAtTime(42, at + 0.16);
            gain.gain.setValueAtTime(0.62, at);
            gain.gain.exponentialRampToValueAtTime(0.001, at + 0.19);
            osc.connect(gain); gain.connect(master);
            osc.start(at); osc.stop(at + 0.2);
          }

          for (let hit = 0; hit <= 14; hit += 2) {
            const at = hit;
            const osc = offline.createOscillator();
            const gain = offline.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(hit === 12 ? 720 : 540, at);
            osc.frequency.exponentialRampToValueAtTime(hit === 12 ? 260 : 190, at + 0.12);
            gain.gain.setValueAtTime(0.25, at);
            gain.gain.exponentialRampToValueAtTime(0.001, at + 0.17);
            osc.connect(gain); gain.connect(master);
            osc.start(at); osc.stop(at + 0.18);
          }

          const riserBuffer = offline.createBuffer(1, sampleRate * 2, sampleRate);
          const data = riserBuffer.getChannelData(0);
          let seed = 1214;
          for (let i = 0; i < data.length; i++) {
            seed = (seed * 16807) % 2147483647;
            data[i] = (seed / 1073741823.5) - 1;
          }
          const riser = offline.createBufferSource();
          const filter = offline.createBiquadFilter();
          const riseGain = offline.createGain();
          riser.buffer = riserBuffer;
          filter.type = "bandpass";
          filter.frequency.setValueAtTime(280, 10);
          filter.frequency.exponentialRampToValueAtTime(6200, 12);
          filter.Q.value = 0.7;
          riseGain.gain.setValueAtTime(0.001, 10);
          riseGain.gain.exponentialRampToValueAtTime(0.11, 12);
          riser.connect(filter); filter.connect(riseGain); riseGain.connect(master);
          riser.start(10); riser.stop(12);

          const rendered = await offline.startRendering();
          const wav = new Uint8Array(makeWav(rendered));
          let binary = "";
          const chunkSize = 0x8000;
          for (let i = 0; i < wav.length; i += chunkSize) {
            binary += String.fromCharCode(...wav.subarray(i, i + chunkSize));
          }
          return btoa(binary);
        };

        const params = new URLSearchParams(location.search);
        if (params.has("render")) {
          document.body.classList.add("render-mode");
          window.seek(0);
        } else {
          const film = document.querySelector("#film");
          const toggle = document.querySelector("#sound-toggle");
          toggle.addEventListener("click", () => {
            film.muted = !film.muted;
            toggle.textContent = film.muted ? "소리 켜기" : "소리 끄기";
            toggle.setAttribute("aria-pressed", String(!film.muted));
            if (!film.muted) film.play();
          });
        }
      })();
    </script>
  </body>
</html>
