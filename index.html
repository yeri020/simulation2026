<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7f4" />
    <title>개념 탐험실</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <a class="brand" href="#" data-view="home" aria-label="개념 탐험실 홈">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none"><path d="M7 22.5C7 14 12 7.5 25 6c-.7 12.4-6.8 19-15.5 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M8 25c3.5-5.3 7.5-9 13-12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
          </span>
          <span><strong>개념 탐험실</strong><small>CONCEPT QUEST</small></span>
        </a>

        <div class="side-label">학습 공간</div>
        <nav class="side-nav" aria-label="주 메뉴">
          <button class="nav-item active" data-view="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>
            <span>탐험 지도</span>
          </button>
          <button class="nav-item" data-view="create">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            <span>새 탐험 만들기</span>
          </button>
          <button class="nav-item" data-view="growth">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h17M8 15l4-4 3 2 5-7"/></svg>
            <span>나의 성장</span>
          </button>
          <a class="nav-item" href="./intro.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <span>인트로</span>
          </a>
        </nav>

        <div class="sidebar-card">
          <span class="sidebar-card-icon">✦</span>
          <strong>배움은 연결될수록<br />오래 남아요</strong>
          <p>정답을 찾기보다 개념이 어떻게 이어지는지 탐험해 보세요.</p>
        </div>
        <div class="profile">
          <span class="profile-avatar">나</span>
          <span><strong>나의 학습 노트</strong><small>오늘도 한 걸음 성장 중</small></span>
          <span class="profile-dots" aria-hidden="true">···</span>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div class="breadcrumb"><span>나의 학습</span><span class="crumb-slash">/</span><strong id="page-label">탐험 지도</strong></div>
          <div class="topbar-right">
            <span class="streak"><span aria-hidden="true">✦</span> <b id="xp-total">0</b> XP</span>
            <span class="top-avatar" aria-label="학습자">나</span>
          </div>
        </header>
        <section id="app-content" class="content" aria-live="polite"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
